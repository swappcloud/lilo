<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#070b14" />
<title>LILO — __NAME_HTML__</title>
<style>
  :root {
    --accent: __ACCENT__;
    --accent2: __ACCENT2__;
    --bg: #070b14;
    --glass: rgba(255, 255, 255, 0.055);
    --glass2: rgba(255, 255, 255, 0.09);
    --stroke: rgba(255, 255, 255, 0.12);
    --text: #f1f5f9;
    --muted: #8fa0b8;
    --paper: #ffffff;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
    --r: 20px;
    --r-sm: 14px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eceef0;
      --glass: rgba(255, 255, 255, 0.62);
      --glass2: rgba(255, 255, 255, 0.85);
      --stroke: rgba(15, 23, 42, 0.1);
      --text: #0d1117;
      --muted: #5b6470;
      --paper: #ffffff;
      --warn: #b45309;
      --err: #b91c1c;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    width: 70vmax;
    height: 70vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.28;
    z-index: -1;
    pointer-events: none;
  }
  body::before { background: var(--accent); top: -35vmax; left: -25vmax; }
  body::after { background: var(--accent2); bottom: -40vmax; right: -30vmax; }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; }

  header { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; margin-top: 8px; }
  .mark { width: 76px; height: 76px; filter: drop-shadow(0 10px 28px color-mix(in srgb, var(--accent) 45%, transparent)); }
  .mark .paper { fill: var(--paper); }
  .mark .ink-stroke { stroke: url(#ink); }
  .mark .paper-stroke { stroke: var(--paper); }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; max-width: 32ch; }

  .steps { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--stroke); transition: all 0.35s var(--ease); }
  .dot.on { width: 26px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .dot.past { background: color-mix(in srgb, var(--accent) 60%, var(--accent2)); }

  .card {
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: var(--r);
    padding: 22px 20px;
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: rise 0.45s var(--ease);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card[hidden] { display: none; }
  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    border-radius: var(--r-sm);
    background: var(--glass2);
    border: 1px solid var(--stroke);
    margin-bottom: 4px;
  }
  .seg[hidden] { display: none; }
  .seg button {
    appearance: none;
    border: 0;
    border-radius: 10px;
    padding: 10px 8px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    cursor: pointer;
    transition: background 0.25s var(--ease), color 0.25s var(--ease);
  }
  .seg button[aria-selected="true"] {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .hint { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0; }
  .page-says {
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
    margin: 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--glass2);
    border-left: 3px solid var(--accent);
  }
  .page-says:empty { display: none; }
  .hint b { color: var(--text); font-weight: 600; }

  input.field {
    width: 100%;
    border-radius: var(--r-sm);
    border: 1px solid var(--stroke);
    background: var(--glass2);
    color: var(--text);
    padding: 15px 16px;
    font-size: 17px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input.field:focus {
    border-color: color-mix(in srgb, var(--accent) 70%, transparent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  input.field.code {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.35em;
    padding-left: calc(16px + 0.35em);
    font-variant-numeric: tabular-nums;
  }
  .error { color: var(--err); font-size: 13px; line-height: 1.45; margin: -4px 0 0; }
  .error:empty { display: none; }

  button.primary {
    appearance: none;
    border: 0;
    border-radius: var(--r-sm);
    padding: 15px 18px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 38%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.15s var(--ease), opacity 0.2s;
  }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.6; cursor: default; }

  .spinner {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2.5px solid currentColor;
    border-right-color: transparent;
    animation: spin 0.8s linear infinite;
    flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .working { flex-direction: row; align-items: center; gap: 14px; }
  .working .spinner { color: var(--accent); width: 22px; height: 22px; }
  .working p { margin: 0; font-size: 15px; line-height: 1.45; }

  .notice { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .notice p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--warn); }

  .tip { gap: 6px; padding: 16px 18px; border-color: color-mix(in srgb, var(--accent) 35%, var(--stroke)); }
  .tip p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .tip .tip-title { color: var(--text); font-weight: 600; font-size: 14px; }
  .tip.alert { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
  .tip.alert .tip-title { color: var(--warn); }
  .done { align-items: center; text-align: center; padding: 30px 20px; }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 40%, transparent);
    animation: pop 0.5s var(--ease);
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .check path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw 0.45s 0.2s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .done h2 { margin: 6px 0 0; font-size: 20px; }
  .done p { margin: 0; color: var(--muted); font-size: 14px; }

  footer { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; display: flex; flex-direction: column; gap: 8px; }
  footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .lock { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>

<main>
  <header>

    </svg>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="steps" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </header>

  <section class="card working" id="working">
    <span class="spinner"></span>
    <p id="working-text"></p>
  </section>

  <form class="card" id="form" hidden novalidate>
    <div class="seg" id="seg" role="tablist" hidden>
      <button type="button" role="tab" data-way="email" id="way-email"></button>
      <button type="button" role="tab" data-way="phone" id="way-phone"></button>
    </div>
    <label for="value" id="label"></label>
    <p class="hint" id="hint"></p>
    <p class="page-says" id="page-says"></p>
    <input class="field" id="value" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" />
    <p class="error" id="error" role="alert"></p>
    <button class="primary" type="submit" id="submit"></button>
  </form>

  <section class="card tip" id="tip" hidden>
    <p class="tip-title" id="tip-title"></p>
    <p id="tip-text"></p>
  </section>

  <section class="card notice" id="notice" hidden>
    <p id="notice-text"></p>
  </section>

  <section class="card done" id="done" hidden>
    <div class="check">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
    </div>
    <h2 id="done-title"></h2>
    <p id="done-text"></p>
  </section>

  <footer>
    <span class="lock" id="privacy"></span>
    __PASTE_LINK__
  </footer>
</main>

  // your authenticator app"), so the phone says where the code comes from.
  function pageSays(text) {
    $('page-says').textContent = text || '';
  }

  // Before the first answer, a heads-up for social sign-ups (only where the
  // backend has the problem: the ones offering a phone number instead); after
  // a social redirect, the same card says what to do.
  function tip(kind) {
    var card = $('tip');
    card.hidden = !kind;
    if (!kind) return;
    var words = { social: [S.socialTitle, S.socialText], signup: [S.signupTitle, S.signupText] }[kind] || [S.tipTitle, S.tipText];
    card.className = 'card tip' + (kind === 'heads-up' ? '' : ' alert');
    $('tip-title').textContent = fill(words[0]);
    $('tip-text').textContent = fill(words[1]);
  }

  function ask(field, error) {
    var first = field === 'email' || field === 'phone';
    // The first question is the user's pick (e-mail or phone number), never
    // the mode the PC page happens to be in.
    if (first && PHONES) field = way;
    $('seg').hidden = !(first && PHONES);
    $('way-email').setAttribute('aria-selected', String(way === 'email'));
    $('way-phone').setAttribute('aria-selected', String(way === 'phone'));
    var spec = INPUTS[field];
    var words = S[field];
    if (!spec || !words) return;
    if (shown !== field) {
      shown = field;
      input.value = '';
      input.type = spec.type;
      input.autocomplete = spec.auto;
      input.inputMode = spec.mode;
      input.className = 'field ' + spec.cls;
      input.maxLength = field === 'code' ? 12 : 256;
      $('label').textContent = words[0];
      $('hint').innerHTML = fill(escape(words[1]).replace('&lt;b&gt;', '<b>').replace('&lt;/b&gt;', '</b>'), {
        name: escape(NAME),
        email: escape(email || NAME)
      });
      steps(STEP_INDEX[field]);
    }
    $('error').textContent = error || '';
    $('submit').textContent = words[2];
    $('submit').disabled = false;
    setView('form');
    if (document.activeElement !== input) setTimeout(function () { input.focus(); }, 60);
  }

  function finished() {
    if (view === 'done') return;
    steps(2);
    input.value = '';
    email = '';
    $('done-title').textContent = S.doneTitle;
    $('done-text').textContent = S.closing;
    setView('done');
    if (navigator.vibrate) navigator.vibrate(30);
    setTimeout(function () {
      try { window.close(); } catch (_) {}
      if (!window.closed) $('done-text').textContent = S.doneText;
    }, 5000);
  }

  async function post(path, body) {
    body.key = KEY;
    var res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok) return null;
    var data = await res.json().catch(function () { return {}; });
    return data.error || String(res.status);
  }

  var stopped = false;
  async function poll() {
    if (stopped) return;
    try {
      var res = await fetch('/api/status?k=' + encodeURIComponent(KEY));
      var data = await res.json();
      var p = data.progress || {};
      if (data.done || p.step === 'done') {
        stopped = true;
        finished();
        return;
      }
      var opening = p.ask === 'email' || p.ask === 'phone';
      if (p.step === 'ask' && !busy) { ask(p.ask); pageSays(p.ask === 'code' ? p.message : ''); tip(opening && PHONES ? 'heads-up' : null); }
      else if (p.step === 'error' && (p.message === 'social' || p.message === 'signup')) { shown = null; ask(p.ask); tip(p.message); }
      else if (p.step === 'error') { shown = shown === p.ask ? shown : null; ask(p.ask, p.message); tip(null); }
      else if (p.step === 'challenge') { $('notice-text').textContent = fill(p.message === 'page-unrecognized' ? S.unrecognized : S.challenge); setView('notice'); }
      else if (p.step === 'working') working(shown ? fill(S.checking) : fill(S.opening));
      else if (p.step === 'idle' && p.message) { $('notice-text').textContent = p.message; setView('notice'); }
    } catch (e) {
      $('notice-text').textContent = S.unreachable;
      setView('notice');
    }
    setTimeout(poll, 900);
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    send();
  });

  async function send() {
    if (busy || !shown) return;
    var value = input.value;
    if (!value.trim()) { $('error').textContent = S.empty; return; }
    if (shown === 'email' && !/^\S+@\S+\.\S+$/.test(value.trim())) { $('error').textContent = S.invalidEmail; return; }
    if (shown === 'phone' && !/^\s*\+[\d\s().-]{7,}$/.test(value)) { $('error').textContent = S.invalidPhone; return; }
    busy = true;
    var field = shown;
    var button = $('submit');
    var label = S[field][2];
    button.disabled = true;
    button.innerHTML = '<span class="spinner"></span>';
    try {
      var error = await post('/api/form/answer', { field: field, value: value });
      if (error) {
        button.textContent = label;
        button.disabled = false;
        $('error').textContent = error;
      } else {
        if (field === 'email' || field === 'phone') email = value.trim();
        working(fill(S.checking));
      }
    } catch (err) {
      button.textContent = label;
      button.disabled = false;
      $('error').textContent = S.unreachable;
    } finally {
      busy = false;
      if (button.disabled === false) button.textContent = label;
    }
  }

  steps(0);
  post('/api/form/start', {}).then(function (error) {
    if (error) { $('notice-text').textContent = error; setView('notice'); }
  }, function () {
    $('notice-text').textContent = S.unreachable;
    setView('notice');
  });
  poll();
})();
</script>
</body>
</html>
