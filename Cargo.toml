# Workspace root.
#
# `lilo-core` holds everything that must also run headless on a headless Linux device:
# the command protocol, media playback and the tool registry. It must never
# depend on `tauri`. `src-tauri` is the desktop app and keeps the WebView,
# login, SDP gateway and phone-login server.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/lilo-core", "crates/lilo-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["LILO"]
license = "GPL-3.0-only"

# Debug builds carry full debug info for every dependency by default, and that
# is most of a multi-gigabyte `target/`. Line tables on our own crates keep
# panic locations useful; the third-party code we never step into does not
# need symbols at all.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "multipart",
    "rustls-no-provider",
    "query",
] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
windows = { version = "0.62.2", default-features = false }
# Match windows 0.62's ABI; collections 0.100 uses a different windows-core.
windows-collections = "0.3.2"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "io-util",
    "io-std",
    "process",
    "sync",
    "signal",
] }
uuid = { version = "1.29.2", features = ["v4"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["clock"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
dirs = "7.0.0"
toml = "1.2.1"
sha2 = "0.11.1"
